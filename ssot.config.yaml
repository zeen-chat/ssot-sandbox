version: 1
collections:
  - name: demo-cards
    dir: product/modules
    role: intent
    type: demo-card
    test_required: true
    include:
      - "**/DEMO-*.md"
  - name: demo-specs
    dir: product/specs
    role: blueprint
    type: demo-spec
    test_required: true
    include:
      - "**/DEMO-*.md"
  - name: glossary
    dir: product
    role: intent
    type: glossary
    test_required: false
    include:
      - "glossary.md"
terminology:
  rules: product/terminology-prh.yml
  exclude:
    - "product/glossary.md"
